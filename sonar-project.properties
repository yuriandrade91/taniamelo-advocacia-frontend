# Análise estática via SonarQube self-hospedado (ver
# ../taniamelo-advocacia-backend/docker-compose.sonar.yml e
# ../taniamelo-advocacia-backend/docs/QUALIDADE_SONAR_HOOKS.md) — mesmo
# servidor local usado pelo backend, um projeto para cada repositório.
#
# Como rodar (servidor já no ar em http://localhost:9000):
#   SONAR_HOST_URL=http://localhost:9000 SONAR_TOKEN=SEU_TOKEN \
#     pnpm dlx sonarqube-scanner
#
# Deliberadamente NÃO se usa a imagem `sonarsource/sonar-scanner-cli` aqui:
# ela é x86_64 e, emulada em Mac ARM, o Node.js embutido do analisador de
# JS/TS não sobe ("Failed to determine the version of Node.js, exit value
# -1") e a análise morre sem resultado. O caminho nativo usa o Node do
# próprio projeto e roda em ~40s.

sonar.projectKey=taniamelo-advocacia-frontend
sonar.projectName=Tania Melo Advocacia — Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/playwright-report/**,**/test-results/**,**/*.d.ts

# Cobertura: gerada por `pnpm test:coverage` (Vitest + @vitest/coverage-v8).
# Rode os testes ANTES da análise - sem este arquivo o painel mostra 0%.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
