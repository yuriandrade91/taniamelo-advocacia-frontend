name: CI

# Roda em todo push e PR: é o portão que o deploy reaproveita.
on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A versão vem do `packageManager` do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Testes de unidade
        run: pnpm test

      # O e2e não entra no CI porque precisa de backend de pé e de
      # credenciais de um escritório de teste. Ver docs/TESTING.md.
